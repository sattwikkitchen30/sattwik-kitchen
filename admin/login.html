<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sattwik Kitchen Admin Login</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="/password-toggle.css" />
</head>
<body class="login-page">
  <div class="login-shell">
    <div class="login-brand">
      <img src="https://res.cloudinary.com/spfurewl/image/upload/v1789330411/sattwik-logo.png" alt="Sattwik Kitchen logo" />
      <h1>Kitchen Admin</h1>
    </div>

    <form id="loginForm" class="login-form">
      <label>
        Email
        <input id="email" type="email" required placeholder="Enter admin email" />
      </label>
      <label>
        Password
        <span class="password-input-wrap">
          <input id="password" type="password" required placeholder="Enter your password" />
          <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false" title="Show password">
            <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7c1 0 1.9-.2 2.8-.5"></path></svg>
          </button>
        </span>
      </label>
      <div style="text-align: right; margin-top: -6px; margin-bottom: 4px;">
        <a href="/forgot-password.html?type=admin" class="forgot-password-link" style="color: #0c7a62; font-size: 12px; font-weight: 700; text-decoration: none;">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-primary">Sign in</button>
      <p id="loginMessage" class="form-message" aria-live="polite"></p>
      
    </form>
  </div>

  <script src="/password-toggle.js"></script>
  <script src="admin.js"></script>
</body>
</html>
