<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Sign In | Sattwik Kitchen</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="customer.css" />
  <link rel="stylesheet" href="/password-toggle.css" />
</head>
<body class="customer-page">
  <main class="customer-shell">
    <a class="customer-brand" href="/"> <img src="https://res.cloudinary.com/spfurewl/image/upload/v1789330411/sattwik-logo.png" alt="Sattwik Kitchen" /></a>
    <div class="customer-card">
      <div class="customer-tabs"><button class="active" data-auth-tab="signin">Sign In</button><button data-auth-tab="signup">Create Account</button></div>
      <section data-auth-panel="signin">
        <p class="eyebrow">WELCOME BACK</p><h1>Sign in to place your order</h1><p class="muted">Your cart will stay saved while you sign in.</p>
        <form id="signinForm" class="customer-form">
          <label>Email<input id="signinEmail" type="email" required autocomplete="email" /></label>
          <label>Password<span class="password-input-wrap"><input id="signinPassword" type="password" required autocomplete="current-password" /><button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false" title="Show password"><svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7c1 0 1.9-.2 2.8-.5"></path></svg></button></span></label>
          <div style="text-align: right; margin-top: -6px; margin-bottom: 6px;">
            <a href="/forgot-password.html?type=customer" class="forgot-password-link" style="color: #0c7a62; font-size: 12px; font-weight: 700; text-decoration: none;">Forgot Password?</a>
          </div>
          <button class="btn btn-primary" type="submit">Sign in</button>
        </form>
      </section>
      <section class="hidden" data-auth-panel="signup">
        <p class="eyebrow">NEW CUSTOMER</p><h1>Create your account</h1><p class="muted">Your details will be attached to every order you place.</p>
        <form id="signupForm" class="customer-form">
          <label>Full name<input id="signupName" type="text" required autocomplete="name" /></label>
          <label>Email<input id="signupEmail" type="email" required autocomplete="email" /></label>
          <label>Phone<input id="signupPhone" type="tel" required autocomplete="tel" /></label>
          <label>Password<span class="password-input-wrap"><input id="signupPassword" type="password" required minlength="8" autocomplete="new-password" /><button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false" title="Show password"><svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7c1 0 1.9-.2 2.8-.5"></path></svg></button></span></label>
          <button class="btn btn-primary" type="submit">Create account</button>
        </form>
      </section>
      <p id="authMessage" class="form-message" aria-live="polite"></p>
      <a class="back-link" href="/">← Back to menu</a>
    </div>
  </main>
  <script src="/password-toggle.js"></script>
  <script src="customer.js"></script>
</body>
</html>
